services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amazon_pulse
      POSTGRES_PASSWORD: amazon_pulse
      POSTGRES_DB: amazon_pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon_pulse -d amazon_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
