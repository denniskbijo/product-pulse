name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy web (product-pulse)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_XWfnHO8gQPC9d9IJbyO5ZH37
      VERCEL_PROJECT_ID: prj_IPOdZFVOl5x1TTEKyr8Kl7nrgw8M
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project metadata
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_IPOdZFVOl5x1TTEKyr8Kl7nrgw8M","orgId":"team_XWfnHO8gQPC9d9IJbyO5ZH37","projectName":"product-pulse"}' > .vercel/project.json

      - name: Pull production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  deploy-api:
    name: Deploy API (product-pulse-api)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_XWfnHO8gQPC9d9IJbyO5ZH37
      VERCEL_PROJECT_ID: prj_8IT8TKOofDxuPQNjfuEXlMPDGyDp
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project metadata
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_8IT8TKOofDxuPQNjfuEXlMPDGyDp","orgId":"team_XWfnHO8gQPC9d9IJbyO5ZH37","projectName":"product-pulse-api"}' > .vercel/project.json

      - name: Pull production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        # FastAPI on Vercel does not use `vercel build --prebuilt` the same way as Next.js.
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
